name: Education access verification
on:
  push:
    branches: [main]
    paths:
      - 'server/educacao/**'
      - 'tests/education-*.test.cjs'
      - 'scripts/probe-education.mjs'
      - '.github/workflows/education-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  education:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test authorization and supervised pilot with fictional identities
        run: node --test tests/education-*.test.cjs
      - name: Check public responses on Render without logging in
        run: node scripts/probe-education.mjs
