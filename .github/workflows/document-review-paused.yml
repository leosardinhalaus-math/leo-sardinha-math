name: Document review publication guard
on:
  push:
    branches: [main]
    paths:
      - 'config/document-review.json'
      - 'scripts/filter-document-review.mjs'
      - 'scripts/probe-review-hidden.mjs'
      - 'tests/education-review-docs.test.cjs'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/document-review-paused.yml'
  workflow_run:
    workflows: ['pages build and deployment', 'Godot Web and Android']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/education-review-docs.test.cjs
  public:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check retired document pages and downloads
        run: node scripts/probe-review-hidden.mjs
