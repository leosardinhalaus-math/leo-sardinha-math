name: Git history secret audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/check_git_history_secrets.py'
      - '.github/workflows/history-secret-audit.yml'

permissions:
  contents: read

jobs:
  history-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan fetched history for high-confidence patterns
        run: python3 tools/check_git_history_secrets.py
