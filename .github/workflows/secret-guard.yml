name: Secret exposure guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for high-confidence exposed secrets
        run: python3 tools/check_tracked_secrets.py
