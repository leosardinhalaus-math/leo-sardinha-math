name: Build Calculus Royale

on:
  pull_request:
    paths:
      - 'jogos/calculus-royale-src/**'
      - '.github/workflows/build-calculus-royale.yml'
  push:
    branches: [main]
    paths:
      - 'jogos/calculus-royale-src/**'
      - '.github/workflows/build-calculus-royale.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculus-royale-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare illustrated assets
        working-directory: jogos/calculus-royale-src
        run: |
          mkdir -p client/public/assets/cards
          python scripts/extract_world_maps.py
          cat .packed/card-sprite.webp.b64.part{1,2,3,4,5,6} | base64 -d > client/public/assets/cards/card-sprite.webp
          test "$(wc -c < client/public/assets/cards/card-sprite.webp)" -gt 50000
          python -m pip install --quiet pillow
          python scripts/split_card_sprite.py
          python scripts/generate_character_assets.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Install dependencies
        working-directory: jogos/calculus-royale-src
        run: npm ci --no-audit --no-fund

      - name: Validate character assets
        working-directory: jogos/calculus-royale-src
        run: |
          node scripts/validate-character-assets.mjs
          node scripts/validate-all-character-assets.mjs
          node scripts/report-character-coverage.mjs

      - name: Check TypeScript
        working-directory: jogos/calculus-royale-src
        run: npm run check

      - name: Test Three.js integration
        working-directory: jogos/calculus-royale-src
        run: |
          npm run test:three
          npm run test:combat

      - name: Build game
        working-directory: jogos/calculus-royale-src
        run: npm run build

      - name: Validate generated GLB models
        working-directory: jogos/calculus-royale-src
        run: npm run test:models

      - name: Audit built asset sizes
        working-directory: jogos/calculus-royale-src
        run: node scripts/audit-asset-sizes.mjs

      - name: Prepare built game for review
        run: |
          test -s jogos/calculus-royale-src/dist/public/index.html
          mkdir -p release/calculus-royale
          cp -R jogos/calculus-royale-src/dist/public/. release/calculus-royale/
      - name: Upload reviewed build candidate (no automatic push)
        uses: actions/upload-artifact@v4
        with:
          name: calculus-royale-build-candidate
          path: release/calculus-royale
          retention-days: 14
