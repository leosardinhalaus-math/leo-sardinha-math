name: Build Calculus Royale

on:
  push:
    branches: [main]
    paths:
      - 'jogos/calculus-royale-src/**'
      - '.github/workflows/build-calculus-royale.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calculus-royale-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare illustrated assets
        working-directory: jogos/calculus-royale-src
        run: |
          mkdir -p client/public/assets/cards
          python scripts/extract_world_maps.py
          cat .packed/card-sprite.webp.b64.part{1,2,3,4,5,6} | base64 -d > client/public/assets/cards/card-sprite.webp
          test "$(wc -c < client/public/assets/cards/card-sprite.webp)" -gt 50000
          python -m pip install --quiet pillow
          python scripts/split_card_sprite.py
          python scripts/generate_character_assets.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: jogos/calculus-royale-src
        run: npm ci --no-audit --no-fund

      - name: Validate character assets
        working-directory: jogos/calculus-royale-src
        run: |
          node scripts/validate-character-assets.mjs
          node scripts/validate-all-character-assets.mjs
          node scripts/report-character-coverage.mjs

      - name: Check TypeScript
        working-directory: jogos/calculus-royale-src
        run: npm run check

      - name: Test Three.js integration
        working-directory: jogos/calculus-royale-src
        run: |
          npm run test:three
          npm run test:combat

      - name: Build game
        working-directory: jogos/calculus-royale-src
        run: npm run build

      - name: Validate generated GLB models
        working-directory: jogos/calculus-royale-src
        run: npm run test:models

      - name: Publish built game into site
        run: |
          rm -rf jogos/calculus-royale
          mkdir -p jogos/calculus-royale
          cp -R jogos/calculus-royale-src/dist/public/. jogos/calculus-royale/

      - name: Commit generated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos/calculus-royale
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build Calculus Royale"
            # Generated source assets are build-time temporaries; remove them before rebasing.
            git reset --hard HEAD
            git clean -fd jogos/calculus-royale-src/client/public/assets/maps jogos/calculus-royale-src/client/public/assets/cards
            git pull --rebase origin main
            git push origin HEAD:main
          fi
