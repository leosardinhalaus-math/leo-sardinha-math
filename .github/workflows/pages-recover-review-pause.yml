name: Recover stale Pages deployment for document review pause
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-recover-review-pause.yml']
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the stale deployment blocking the requested document removal
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const current = await github.rest.repos.getContent({...repo, path: 'config/document-review.json', ref: 'main'});
            const settings = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            if (settings.paused !== true) throw new Error('Document-review pause is not active; recovery stopped');
            // Fixed deployment ID reported by Pages as blocking this publication.
            // No site deletion, settings change, credential access or general cancellation.
            const pages_deployment_id = '9e582b3140c4a44642ea817f1eb1cf64ae5d3eed';
            const args = {...repo, pages_deployment_id};
            const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', args);
            core.info(JSON.stringify({deployment: pages_deployment_id, status: result.data.status}));
            try {
              const cancelled = await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', args);
              core.info(JSON.stringify({deployment: pages_deployment_id, cancellationHttpStatus: cancelled.status}));
            } catch (error) {
              core.setFailed('Could not cancel the stale deployment; HTTP ' + (error.status || 'unknown'));
            }
