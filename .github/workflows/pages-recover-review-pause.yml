name: Recover stale Pages deployment for document review pause
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-recover-review-pause.yml']
permissions:
  contents: read
  pages: write
  deployments: read
jobs:
  rebuild-current-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a fresh Pages build for the paused document review
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const current = await github.rest.repos.getContent({...repo, path: 'config/document-review.json', ref: 'main'});
            const settings = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            if (settings.paused !== true) throw new Error('Document-review pause is not active; recovery stopped');
            // Diagnose the exact prior revision reported as blocking Pages.
            const stale = '9e582b3140c4a44642ea817f1eb1cf64ae5d3eed';
            const site = await github.request('GET /repos/{owner}/{repo}/pages', repo);
            core.info(JSON.stringify({siteStatus:site.data.status, buildType:site.data.build_type, source:site.data.source}));
            const list = await github.request('GET /repos/{owner}/{repo}/deployments', {...repo, sha:stale, environment:'github-pages', per_page:10});
            let cancelled = 0;
            for (const deployment of list.data) {
              const statuses = await github.request('GET /repos/{owner}/{repo}/deployments/{deployment_id}/statuses', {...repo, deployment_id:deployment.id, per_page:1});
              const state = statuses.data[0]?.state;
              core.info(JSON.stringify({deploymentId:deployment.id, sha:deployment.sha, state}));
              if (deployment.sha !== stale || !['queued','pending','in_progress'].includes(state)) continue;
              try {
                const pages = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {...repo,pages_deployment_id:String(deployment.id)});
                core.info(JSON.stringify({pagesDeploymentId:deployment.id, status:pages.data.status}));
                if (['succeed','success','deployment_failed','deployment_cancelled','cancelled'].includes(pages.data.status)) continue;
                const result = await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {...repo,pages_deployment_id:String(deployment.id)});
                core.info(JSON.stringify({cancelledDeploymentId:deployment.id,httpStatus:result.status}));
                cancelled++;
              } catch (error) { core.info(JSON.stringify({deploymentId:deployment.id,recoveryHttpStatus:error.status||0})); }
            }
            if (cancelled > 0) {
              const queued = await github.request('POST /repos/{owner}/{repo}/pages/builds', repo);
              core.info(JSON.stringify({buildRequestHttpStatus:queued.status,buildStatus:queued.data.status}));
            }
            const base = 'https://leosardinhalaus-math.github.io/leo-sardinha-math';
            const routes = ['/docs/revisao-privacidade.html','/docs/revisao-publica/','/docs/privacidade-rascunho.pdf','/docs/termos-rascunho.pdf'];
            let hidden = false;
            const attempts = cancelled > 0 ? 8 : 1;
            for (let attempt=0;attempt<attempts;attempt++) {
              if (cancelled > 0) await new Promise(resolve=>setTimeout(resolve,15000));
              const checks=[];
              for (const route of routes) {
                const response=await fetch(base+route,{redirect:'manual',signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
                checks.push({route,status:response.status});
              }
              core.info(JSON.stringify({attempt:attempt+1,checks}));
              hidden=checks.every(check=>[404,410].includes(check.status));
              if(hidden)break;
            }
            if(!hidden)core.setFailed('Pages publication remains blocked; no eligible stale deployment could be safely cancelled or the new publication has not completed.');
