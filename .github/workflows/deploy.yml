name: Godot Web and Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install image tools
        run: python -m pip install Pillow==11.3.0
      - name: Prepare and verify assets
        run: |
          python slice_assets.py
          python tests/godot/test_assets.py
      - name: Cache Godot and export templates
        uses: actions/cache@v4
        id: godot-cache
        with:
          path: |
            ~/.local/bin/calculus-godot
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-web-android-v1
      - name: Download pinned Godot and templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" --output "$RUNNER_TEMP/godot.zip"
          mkdir -p "$HOME/.local/bin/calculus-godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/.local/bin/calculus-godot"
          chmod +x "$HOME/.local/bin/calculus-godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$HOME/.local/bin/calculus-godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/calculus-godot/godot"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" --output "$RUNNER_TEMP/templates.tpz"
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          target=Path.home()/'.local/share/godot/export_templates'/f"{os.environ['GODOT_VERSION']}.stable"
          target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'templates.tpz') as archive:
              for name in archive.namelist():
                  if name.startswith(('templates/web_', 'templates/android_')) and not name.endswith('/'):
                      (target/Path(name).name).write_bytes(archive.read(name))
          PY
      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin/calculus-godot" >> "$GITHUB_PATH"
      - name: Import and test game
        run: |
          godot --headless --editor --import --quit
          XDG_DATA_HOME="$RUNNER_TEMP/godot-test-data" godot --headless --script tests/godot/test_game.gd
      - name: Export Web without SharedArrayBuffer requirements
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
          python tools/verify_godot_export.py --engine godot --pack build/web/index.pck
          python tools/version_web_export.py --dir build/web
      - name: Render screens with software OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/godot-visual-test
        run: timeout 90s xvfb-run -a godot --rendering-method gl_compatibility --audio-driver Dummy --script tests/godot/capture_screens.gd
      - uses: actions/upload-artifact@v4
        with:
          name: calculus-royale-screens
          path: build/screens/*.png
          retention-days: 30
      - name: Configure Android SDK and debug signing
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          python tools/setup_godot_android.py
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Export installable test APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --export-debug Android build/android/calculus-royale-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: calculus-royale-web
          path: build/web/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: calculus-royale-android-debug
          path: build/android/*.apk
          retention-days: 30
      - name: Preserve the complete site and add the Godot game
        run: |
          # Read the latest static site if another build updated it during export.
          git fetch origin main
          mkdir -p build/site/jogos/calculus-royale-godot
          git archive origin/main | tar -x -C build/site
          rm -rf build/site/assets/models_3d build/site/assets/source
          cp -R build/web/. build/site/jogos/calculus-royale-godot/
          touch build/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
