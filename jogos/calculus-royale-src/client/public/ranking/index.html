<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking · Calculus Royale</title><link rel="stylesheet" href="../player.css"></head><body><main class="shell"><div class="top"><a class="brand" href="../">CALCULUS <span>ROYALE</span></a><nav class="nav"><a href="../">Jogar</a><a href="../perfil/">Meu perfil</a><a href="../../../educacao.html">Educação</a></nav></div><section class="hero"><span class="eyebrow">RANKING ONLINE</span><h1>Quem domina o cálculo?</h1><p class="muted">Compare troféus, progresso e a melhor marca na Torre de Sobrevivência.</p></section><section class="panel" style="margin-top:14px"><div class="tabs"><button class="tab active" data-sort="trophies.desc">Geral</button><button class="tab" data-sort="best_tower_wave.desc">Torre</button><button class="tab" data-sort="completed_worlds.desc,xp.desc">Progresso</button></div><div id="rank" class="rank-list"><p class="muted">Carregando ranking...</p></div></section></main><script src="../player.js"></script><script>
const C=window.CalculusCloud,$=C.$,$$=C.$$;
async function load(sort){$("#rank").innerHTML='<p class="muted">Carregando ranking...</p>';try{const rows=await C.leaderboard(sort);if(!rows.length){$("#rank").innerHTML='<p class="muted">Ainda não há jogadores no ranking. Seja o primeiro.</p>';return}$("#rank").innerHTML=rows.map((r,i)=>{const main=sort.startsWith("best_tower")?"Onda "+r.best_tower_wave:sort.startsWith("completed")?r.completed_worlds+"/5 mundos":r.trophies+" 🏆";return '<a class="rank-row" href="../perfil/?u='+encodeURIComponent(r.profile.public_slug)+'"><div class="rank-pos">#'+(i+1)+'</div><div><strong>'+C.safe(r.profile.username)+'</strong><div class="muted">Nível '+r.level+' · '+r.wins+' vitórias</div></div><div class="rank-score">'+C.safe(main)+'</div><div class="rank-sub">'+r.xp+' XP</div></a>'}).join("")}catch(e){$("#rank").innerHTML='<p class="msg">'+C.safe(e.message)+'</p>'}}
$$(".tab").forEach(b=>b.onclick=()=>{$$(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");load(b.dataset.sort)});load("trophies.desc");
</script></body></html>
