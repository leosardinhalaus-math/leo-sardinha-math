<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · Calculus Royale</title><link rel="stylesheet" href="../player.css"></head><body><main class="shell"><div class="top"><a class="brand" href="../">CALCULUS <span>ROYALE</span></a><nav class="nav"><a href="../">Jogar</a><a href="../ranking/">Ranking</a><a href="../../../educacao.html">Educação</a></nav></div><section class="hero"><span class="eyebrow">PERFIL DO JOGADOR</span><h1 id="heroTitle">Seu reino matemático.</h1><p class="muted" id="heroText">Entre para salvar seu progresso online e aparecer no ranking.</p></section><div class="grid"><section class="panel span4" id="authPanel"><h2>Entrar</h2><div class="auth"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="field" style="margin-top:10px"><label>Nome do jogador <small class="muted">(só no cadastro)</small></label><input id="username" maxlength="24" placeholder="Ex.: Leo Sardinha"></div><div class="nav" style="margin-top:12px"><button class="btn primary" id="loginBtn">Entrar</button><button class="btn gold" id="signupBtn">Criar conta</button></div><div class="msg" id="authMsg"></div></section><section class="panel span8" id="profilePanel"><p class="muted">Faça login para carregar seu perfil.</p></section></div></main><script src="../player.js"></script><script>
const C=window.CalculusCloud,$=C.$;
function stat(label,value){return '<div class="stat"><small>'+label+'</small><strong>'+C.safe(value)+'</strong></div>'}
async function renderPublic(slug){const data=await C.publicProfile(slug);if(!data){$("#profilePanel").innerHTML="<h2>Jogador não encontrado</h2>";return}const p=data.profile,s=data.stats||{};$("#authPanel").style.display="none";$("#heroTitle").textContent=p.username;$("#heroText").textContent="Perfil público no Calculus Royale";$("#profilePanel").className="panel span12";$("#profilePanel").innerHTML='<div class="profile-head"><div class="avatar">'+C.safe(p.avatar_seed)+'</div><div><h2>'+C.safe(p.username)+'</h2><div class="muted">@'+C.safe(p.public_slug)+'</div></div></div><div class="stats" style="margin-top:18px">'+stat("Troféus",s.trophies||0)+stat("Nível",s.level||1)+stat("Vitórias",s.wins||0)+stat("Melhor onda",s.best_tower_wave||0)+stat("Mundos",s.completed_worlds||0)+stat("Baús",s.chests_opened||0)+stat("Moedas",s.coins||0)+stat("Essência",s.essence||0)+'</div>'}
async function renderMine(){const s=await C.session();if(!s)return;let p=await C.getProfile(s);if(!p){const pending=localStorage.getItem("calculus-royale:pending-username")||"";if(pending){try{p=await C.ensureProfile(s,pending)}catch(e){$("#authMsg").textContent=e.message;return}}else{ $("#authMsg").textContent="Informe um nome de jogador e clique em Criar conta/Entrar novamente."; return }}let stats;try{stats=await C.syncProgress(s)}catch{stats=await C.getMyStats(s)||{}}$("#authPanel").style.display="none";$("#heroTitle").textContent="Olá, "+p.username+"!";$("#heroText").textContent="Seu progresso local foi sincronizado com o ranking online.";$("#profilePanel").className="panel span12";const link=location.origin+location.pathname+"?u="+encodeURIComponent(p.public_slug);$("#profilePanel").innerHTML='<div class="profile-head"><div class="avatar">'+C.safe(p.avatar_seed)+'</div><div><h2>'+C.safe(p.username)+'</h2><div class="muted">@'+C.safe(p.public_slug)+'</div></div></div><div class="stats" style="margin-top:18px">'+stat("Troféus",stats.trophies||0)+stat("Nível",stats.level||1)+stat("Vitórias",stats.wins||0)+stat("Melhor onda",stats.best_tower_wave||0)+stat("Mundos",stats.completed_worlds||0)+stat("Baús",stats.chests_opened||0)+stat("Moedas",stats.coins||0)+stat("Essência",stats.essence||0)+'</div><p class="muted" style="margin-top:16px">Perfil público</p><div class="public-link">'+C.safe(link)+'</div><div class="nav" style="margin-top:14px"><button class="btn primary" id="syncBtn">Sincronizar agora</button><a class="btn gold" href="../ranking/">Ver ranking</a><button class="btn danger" id="logoutBtn">Sair</button></div>';$("#syncBtn").onclick=async()=>{await C.syncProgress(s);location.reload()};$("#logoutBtn").onclick=C.logout}
$("#loginBtn").onclick=async()=>{try{$("#authMsg").textContent="Entrando...";await C.signIn($("#email").value.trim(),$("#password").value);await renderMine()}catch(e){$("#authMsg").textContent=e.message}};
$("#signupBtn").onclick=async()=>{try{const u=$("#username").value.trim();if(u.length<3)throw new Error("Escolha um nome com pelo menos 3 caracteres.");$("#authMsg").textContent="Criando conta...";const r=await C.signUp($("#email").value.trim(),$("#password").value,u);if(r?.access_token){await renderMine()}else{$("#authMsg").textContent="Conta criada. Se o Supabase solicitar confirmação, confira seu e-mail e depois entre aqui."}}catch(e){$("#authMsg").textContent=e.message}};
(async()=>{const slug=new URLSearchParams(location.search).get("u");if(slug)await renderPublic(slug);else await renderMine()})();
</script></body></html>
