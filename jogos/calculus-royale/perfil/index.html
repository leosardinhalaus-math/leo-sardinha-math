<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · Calculus Royale</title><link rel="stylesheet" href="../player.css"></head><body><main class="shell"><div class="top"><a class="brand" href="../">CALCULUS <span>ROYALE</span></a><nav class="nav"><a href="../">Jogar</a><a href="../ranking/">Ranking</a><a href="../../../educacao.html">Educação</a></nav></div><section class="hero"><span class="eyebrow">PERFIL DO JOGADOR</span><h1 id="heroTitle">Seu reino matemático.</h1><p class="muted" id="heroText">Entre para salvar seu progresso online e aparecer no ranking.</p></section><div class="grid"><section class="panel span4" id="authPanel"><h2>Entrar</h2><div class="auth"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="field" style="margin-top:10px"><label>Nome do jogador <small class="muted">(só no cadastro)</small></label><input id="username" maxlength="24" placeholder="Ex.: Leo Sardinha"></div><div class="nav" style="margin-top:12px"><button class="btn primary" id="loginBtn">Entrar</button><button class="btn gold" id="signupBtn">Criar conta</button></div><div class="msg" id="authMsg"></div></section><section class="panel span8" id="profilePanel"><p class="muted">Faça login para carregar seu perfil.</p></section></div></main><script src="../cloud-config.js"></script><script src="../player.js"></script><script>
const C=window.CalculusCloud,$=C.$;
function stat(label,value){return '<div class="stat"><small>'+label+'</small><strong>'+C.safe(value)+'</strong></div>'}
function statsHTML(stats={}){return '<div class="stats" style="margin-top:18px">'+[['Troféus','trophies'],['Nível','level'],['Vitórias','wins'],['Melhor onda','best_tower_wave'],['Mundos','completed_worlds'],['Baús','chests_opened'],['Moedas','coins'],['Essência','essence']].map(([label,key])=>stat(label,stats[key]||(key==='level'?1:0))).join('')+'</div>'}
function profileHTML(profile){return '<div class="profile-head"><div class="avatar">'+C.safe(profile.avatar_seed)+'</div><div><h2>'+C.safe(profile.username)+'</h2><div class="muted">@'+C.safe(profile.public_slug)+'</div></div></div>'}
async function renderPublic(slug){
 const data=await C.publicProfile(slug);
 if(!data){$('#profilePanel').innerHTML='<h2>Jogador não encontrado</h2>';return}
 $('#authPanel').style.display='none';$('#heroTitle').textContent=data.profile.username;
 $('#heroText').textContent='Perfil público no Calculus Royale. As estatísticas são informadas pelo jogador e não verificadas pelo servidor.';$('#profilePanel').className='panel span12';
 $('#profilePanel').innerHTML=profileHTML(data.profile)+statsHTML(data.stats||{});
}
async function renderMine(){
 const session=await C.session();if(!session)return;
 let profile=await C.getProfile(session);
 if(!profile){const name=localStorage.getItem('calculus-royale:pending-username')||$('#username').value.trim();if(!name){$('#authMsg').textContent='Informe um nome de jogador e entre novamente.';return}profile=await C.ensureProfile(session,name);localStorage.removeItem('calculus-royale:pending-username')}
 const stats=await C.getMyStats(session).catch(()=>null)||C.localProgress();
 $('#authPanel').style.display='none';$('#heroTitle').textContent='Olá, '+profile.username+'!';
 $('#heroText').textContent='Escolha quando salvar online. Neste aparelho, seu jogo continua disponível sem conexão.';
 $('#profilePanel').className='panel span12';
 const link=location.origin+location.pathname+'?u='+encodeURIComponent(profile.public_slug);
 $('#profilePanel').innerHTML=profileHTML(profile)+statsHTML(stats)+'<p class="muted" style="margin-top:16px">Perfil público</p><div class="public-link">'+C.safe(link)+'</div><p id="cloudStatus" class="msg" role="status" aria-live="polite">O progresso deste aparelho ainda não foi enviado nesta visita.</p><div class="nav" style="margin-top:14px"><button class="btn primary" id="syncBtn">Salvar progresso online</button>'+(C.restoreProgress?'<button class="btn gold" id="restoreBtn">Carregar progresso salvo</button>':'')+'<a class="btn gold" href="../ranking/">Ver ranking</a><button class="btn danger" id="logoutBtn">Sair</button></div>';
 async function transfer(button,action,message){button.disabled=true;$('#cloudStatus').textContent='Sincronizando…';try{await action();$('#cloudStatus').textContent=message}catch{$('#cloudStatus').textContent='Não foi possível sincronizar agora. O progresso deste aparelho foi preservado.'}finally{button.disabled=false}}
 $('#syncBtn').onclick=()=>transfer($('#syncBtn'),()=>C.syncProgress(session),'Progresso salvo online. Você já pode carregá-lo em outro aparelho.');
 if(C.restoreProgress)$('#restoreBtn').onclick=()=>{if(confirm('Substituir o progresso deste aparelho pelo seu salvamento online?'))return transfer($('#restoreBtn'),async()=>{await C.restoreProgress(session);location.reload()},'Progresso carregado.')};
 $('#logoutBtn').onclick=()=>Promise.resolve(C.logout()).catch(()=>{$('#cloudStatus').textContent='Não foi possível sair agora. Tente novamente.'});
}
async function authenticate(action){$('#loginBtn').disabled=$('#signupBtn').disabled=true;try{await action()}catch(error){$('#authMsg').textContent=error.message}finally{$('#loginBtn').disabled=$('#signupBtn').disabled=false}}
$('#loginBtn').onclick=()=>authenticate(async()=>{$('#authMsg').textContent='Entrando…';await C.signIn($('#email').value.trim(),$('#password').value);await renderMine()});
$('#signupBtn').onclick=()=>authenticate(async()=>{const name=$('#username').value.trim();if(name.length<3)throw Error('Escolha um nome com pelo menos três caracteres.');$('#authMsg').textContent='Criando conta…';const result=await C.signUp($('#email').value.trim(),$('#password').value,name);if(result?.user?.id||result?.access_token)await renderMine();else $('#authMsg').textContent='Confira seu e-mail para confirmar a conta e depois entre aqui.'});
(async()=>{try{const slug=new URLSearchParams(location.search).get('u');if(slug)await renderPublic(slug);else await renderMine()}catch(error){$('#authMsg').textContent=error.message}})();
</script></body></html>
