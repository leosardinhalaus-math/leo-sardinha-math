<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Gerar ícones</title><h1>Gerar ícones do Laboratório</h1><p>Clique para baixar cada PNG. Coloque os arquivos na pasta icons/.</p><div id="botoes"></div><script>
function gerar(tamanho,maskable){const c=document.createElement('canvas');c.width=c.height=tamanho;const x=c.getContext('2d');x.fillStyle='#143d4a';x.fillRect(0,0,tamanho,tamanho);const s=tamanho/512;x.save();x.scale(s,s);x.translate(256,256);if(maskable)x.scale(.76,.76);x.fillStyle='#f1b64d';x.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;x.lineTo(Math.cos(a)*173,Math.sin(a)*173)}x.closePath();x.fill();x.strokeStyle='#fff';x.lineWidth=15;x.stroke();x.fillStyle='#143d4a';x.font='bold 210px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('∑',0,-3);x.restore();return c.toDataURL('image/png')}
for(const [nome,tamanho,maskable] of [['icon-192.png',192,false],['icon-512.png',512,false],['icon-maskable-512.png',512,true]]){const a=document.createElement('a');a.href=gerar(tamanho,maskable);a.download=nome;a.textContent='Baixar '+nome;a.style='display:block;margin:1rem';document.querySelector('#botoes').append(a)}
</script></html>
