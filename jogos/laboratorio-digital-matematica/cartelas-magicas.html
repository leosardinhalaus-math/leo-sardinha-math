<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Grimório das Seis Runas · Laboratório Digital</title>
<meta name="description" content="Cartelas mágicas, potências de 2 e base binária em quatro atividades interativas.">
<link rel="stylesheet" href="./css/chibi-3d.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<style>
:root{--bg:#f1eefb;--star:#d9d1f3;--card:#fff;--tx:#231a4a;--mut:#5d5488;--pri:#6a3fd6;--ok:#1f7a3a;--bad:#c62828;--line:#cfc6ee;--gold:#a8620a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d26;--star:#3a2f6b;--card:#1d1640;--tx:#efeaff;--mut:#b3a8dd;--pri:#b79cff;--ok:#79e29a;--bad:#ff8f8f;--line:#3d3270;--gold:#f4c95d}}
:root[data-theme="dark"]{--bg:#120d26;--star:#3a2f6b;--card:#1d1640;--tx:#efeaff;--mut:#b3a8dd;--pri:#b79cff;--ok:#79e29a;--bad:#ff8f8f;--line:#3d3270;--gold:#f4c95d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bg);background-image:radial-gradient(var(--star) 1.2px,transparent 1.6px),radial-gradient(var(--star) 1px,transparent 1.4px);background-size:57px 57px,89px 89px;background-position:0 0,23px 41px;min-height:100vh}
main{max-width:38rem;margin:0 auto;padding:1rem}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.2;margin:.2rem 0 .5rem}
h1{font-size:2rem;color:var(--gold)}h2{font-size:1.3rem}h3{font-size:1.1rem;text-align:center;margin:0 0 .5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:1rem;margin:.8rem 0}
.mut{color:var(--mut);font-size:.9rem}
.tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin:.6rem 0}
button{font:inherit;min-height:3rem;padding:.5rem 1rem;border-radius:.6rem;border:2px solid var(--pri);background:var(--pri);color:#fff;font-weight:600;cursor:pointer;margin:.2rem .2rem .2rem 0}
button.sec{background:transparent;color:var(--pri)}
button.on{background:var(--gold);border-color:var(--gold);color:#120d26}
button:focus-visible,input:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.cartela{border:3px solid var(--rc,var(--pri));border-radius:.7rem;padding:.6rem;background:var(--card)}
.cartela h3{color:var(--rc,var(--tx))}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;font-family:"Courier New",monospace;font-size:1.35rem;font-weight:700;text-align:center}
.nums span{padding:.2rem;border:1px solid var(--line);border-radius:.3rem}
.big{font-family:"Iowan Old Style",Georgia,serif;font-size:3.6rem;font-weight:700;text-align:center;color:var(--gold)}
.tt{text-align:center;font-weight:700;font-size:1.2rem}
.runes{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.5rem 0}
button.rn{min-width:0;width:100%;margin:0;background:transparent;color:var(--tx);border-color:var(--rc);flex-direction:column;line-height:1.2}
button.rn[aria-pressed="true"]{background:var(--rc);color:#120d26}
.dragon{text-align:center;font-size:3rem;line-height:1.1}
.dragon b{display:block;font-size:1.1rem;font-family:"Courier New",monospace}
input{width:6rem;min-height:2.75rem;font:inherit;font-size:1.1rem;text-align:center;border:2px solid var(--line);border-radius:.5rem;background:var(--card);color:var(--tx)}
.good{color:var(--ok);font-weight:600}.wrong{color:var(--bad);font-weight:600}
@media (prefers-reduced-motion:no-preference){.big{animation:glow 1.6s ease-in-out infinite alternate}@keyframes glow{from{text-shadow:0 0 4px transparent}to{text-shadow:0 0 18px var(--gold)}}}
.fig{display:flex;justify-content:center;align-items:flex-end;gap:.5rem;margin-bottom:.5rem}.fig svg{width:min(9rem,38vw);height:auto}.fig .mago-chibi{display:block;width:min(14rem,60vw);height:auto;filter:drop-shadow(0 12px 18px #28165730)}.ritual-intro .fig .mago-chibi{width:min(17rem,68vw)}
#print{display:none}
@media print{main{display:none}#print{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}body{background:#fff;color:#000}.cartela{break-inside:avoid;border-color:#000}.cartela h3{color:#000}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button:not(.sec):not(.rn):not(.on){color:#120d26}}
:root[data-theme="dark"] button:not(.sec):not(.rn):not(.on){color:#120d26}
.back{font-size:.9rem;margin-bottom:.4rem}.back a{color:var(--pri);font-weight:600}

/* Cenário e elenco chibi */
body{background-color:var(--bg);background-image:linear-gradient(#f1eefbe8,#f1eefbf0),url('./images/laboratorio-chibi.webp');background-size:cover;background-position:center;background-attachment:fixed}
main{max-width:44rem}
.card{border-radius:1.3rem;box-shadow:0 14px 34px #29145e1b;backdrop-filter:blur(10px)}
.tabs button{border-radius:999px;box-shadow:0 4px 10px #2816571a}
.cartela{border-radius:1.1rem;background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--card) 86%,var(--rc)));box-shadow:0 12px 28px #2816571b}
.nums span{border-radius:.5rem;background:color-mix(in srgb,var(--card) 92%,var(--rc))}
button.rn{border-radius:1rem;box-shadow:0 4px 9px #28165718;transition:transform .18s ease}
button.rn:hover{transform:translateY(-2px)}
.fig .sprite-jogo{display:block;flex:none;width:min(12rem,39vw);aspect-ratio:1;background-image:url('./images/batalha-chibi.webp');background-size:200% 100%;background-repeat:no-repeat;filter:drop-shadow(0 10px 12px #2816573f)}
.sprite-jogo.heroi{background-position:left center}.sprite-jogo.dragao{background-position:right center}
.sprite-jogo.nivel-3,.sprite-jogo.nivel-4{filter:drop-shadow(0 0 18px #e7b842aa)}
.sprite-jogo.cor-1{filter:hue-rotate(55deg) drop-shadow(0 10px 12px #2816573f)}.sprite-jogo.cor-2{filter:hue-rotate(115deg) drop-shadow(0 10px 12px #2816573f)}.sprite-jogo.cor-3{filter:hue-rotate(185deg) drop-shadow(0 10px 12px #2816573f)}.sprite-jogo.cor-4{filter:hue-rotate(245deg) drop-shadow(0 10px 12px #2816573f)}
.sprite-jogo.vencido{filter:grayscale(.9);opacity:.55;transform:rotate(-9deg)}
.fig [data-fala]{cursor:pointer}
.fig [data-fala]:focus-visible{outline:3px solid var(--pri);outline-offset:4px;border-radius:1rem}
.fala-jogo{width:fit-content;max-width:90%;margin:.3rem auto .7rem;padding:.55rem .8rem;border:1px solid var(--line);border-radius:1rem 1rem .2rem 1rem;background:color-mix(in srgb,var(--card) 85%,var(--star));color:var(--tx);font-weight:700;text-align:center}
@media(prefers-reduced-motion:no-preference){
  @keyframes jogo-flutuar{0%,100%{translate:0 0}50%{translate:0 -9px}}
  @keyframes jogo-respirar{0%,100%{translate:0 0;rotate:-1deg}50%{translate:0 -6px;rotate:1deg}}
  @keyframes runa-acesa{from{scale:.94;box-shadow:0 0 0 0 transparent}to{scale:1;box-shadow:0 0 15px var(--rc)}}
  @keyframes jogo-saudacao{0%,100%{translate:0 0;rotate:0deg}30%{translate:0 -17px;rotate:-9deg}60%{translate:0 -7px;rotate:9deg}}
  @keyframes jogo-fala{from{opacity:0;scale:.9}to{opacity:1;scale:1}}
  .fig .mago-chibi{animation:jogo-flutuar 4s ease-in-out infinite}
  .fig .sprite-jogo.heroi{animation:jogo-flutuar 3.7s ease-in-out infinite}
  .fig .sprite-jogo.dragao:not(.vencido){animation:jogo-respirar 3.2s ease-in-out -1s infinite}
  .fig [data-fala].reagindo,.fig .sprite-jogo.vencido.reagindo{animation:jogo-saudacao .8s ease-in-out 2}
  .fala-jogo{animation:jogo-fala .25s ease-out both}
  button.rn[aria-pressed="true"]{animation:runa-acesa .3s ease-out both}
  .tabs button{transition:translate .18s ease,box-shadow .18s ease}
  .tabs button:hover{translate:0 -2px;box-shadow:0 7px 14px #28165733}
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background-image:linear-gradient(#120d26e8,#120d26f0),url('./images/laboratorio-chibi.webp')}}
:root[data-theme="dark"] body{background-image:linear-gradient(#120d26e8,#120d26f0),url('./images/laboratorio-chibi.webp')}
@media(prefers-reduced-motion:reduce){button.rn{transition:none}}
@media print{body{background:#fff}.card,.cartela{box-shadow:none}}
</style>
</head>
<body>
<main><nav class="back" aria-label="Voltar ao laboratório"><a href="./index.html#/">← Todos os jogos</a></nav><div id="app"></div></main>
<div id="print"></div>
<script>
const app=document.getElementById('app');
const R=[{e:'🔥',n:'Fogo',c:'#ff6b3d'},{e:'💧',n:'Água',c:'#3da5ff'},{e:'🌿',n:'Terra',c:'#3fae5a'},{e:'🌪️',n:'Vento',c:'#4cbfd6'},{e:'✨',n:'Luz',c:'#e0a800'},{e:'🌑',n:'Sombra',c:'#8e6bd6'}];
const nums=k=>{const a=[];for(let n=1;n<64;n++)if(n>>k&1)a.push(n);return a};
const val=a=>a.reduce((s,b,i)=>s+(b?1<<i:0),0);
const rc=k=>`style="--rc:${R[k].c}"`;
const cardHTML=k=>`<div class="cartela" ${rc(k)}><h3>${R[k].e} Runa de ${R[k].n} (vale ${1<<k})</h3><div class="nums">${nums(k).map(n=>`<span>${n}</span>`).join('')}</div></div>`;
const conta=a=>{const t=a.map((b,i)=>b?`${R[i].e}${1<<i}`:'').filter(Boolean);return t.length?t.join(' + ')+' = '+val(a):'0'};
const titulo=p=>p===63?'👑 LENDA: todas as runas!':p>=48?'🧙 Arquimago':p>=32?'⚡ Mago de Elite':p>=16?'🗡️ Aventureiro':'🌱 Aprendiz';
const tier=p=>p>=63?4:p>=48?3:p>=32?2:p>=16?1:0;
const wizard=()=>`<img class="mago-chibi" src="./images/mago-chibi.webp" width="900" height="1080" alt="Mestre Arcano, mago chibi de chapéu roxo, barba branca e cajado luminoso" role="button" tabindex="0" aria-label="Conversar com o Mestre Arcano" data-fala="Uma runa de cada vez. A magia está na soma!">`;
const heroT=(t,dim)=>`<span class="sprite-jogo heroi nivel-${t}" role="button" tabindex="0" aria-label="Conversar com o herói chibi de nível ${t+1}" data-fala="Escolha as runas e me dê poder!"${dim?' style="opacity:.35"':''}></span>`;
const dragon=(n,dead)=>`<span class="sprite-jogo dragao cor-${n%5}${dead?' vencido':''}" role="button" tabindex="0" aria-label="Conversar com o dragão chibi" data-fala="${dead?'Você acertou meu número!':'Raa! Monte o dano exato para me vencer!'}"></span>`;
const animar=(id,tipo)=>queueMicrotask(()=>document.dispatchEvent(new CustomEvent('chibi:evento',{detail:{id,tipo}})));
app.addEventListener('click',event=>{
  const personagem=event.target.closest('.fig [data-fala]');
  if(!personagem||!app.contains(personagem))return;
  const cartao=personagem.closest('.card');
  let fala=cartao.querySelector('.fala-jogo');
  if(!fala){fala=document.createElement('p');fala.className='fala-jogo';fala.setAttribute('role','status');personagem.closest('.fig').insertAdjacentElement('afterend',fala)}
  fala.textContent=personagem.dataset.fala;
  personagem.classList.remove('reagindo');void personagem.offsetWidth;personagem.classList.add('reagindo');
  clearTimeout(fala._tempo);fala._tempo=setTimeout(()=>{fala.remove();personagem.classList.remove('reagindo')},6000);
});
app.addEventListener('keydown',event=>{
  if((event.key==='Enter'||event.key===' ')&&event.target.matches('.fig [data-fala]')){event.preventDefault();event.target.click()}
});
function nextD(){B.won=false;if(B.n<5)B.d=hpNew();draw();animar('heroi',B.n===5?'vitoria':'fase')}
document.getElementById('print').innerHTML=[0,1,2,3,4,5].map(cardHTML).join('');

let tab='ritual',step=0,resp=[],started=false,pl=[0,0,0,0,0,0],B=null;
const tabs=[['ritual','🔮 Ritual'],['forja','⚒️ Forja'],['batalha','🐉 Batalha'],['segredo','📜 Segredo']];
const runeBtns=(a,fn)=>`<div class="runes">${a.map((b,i)=>`<button class="rn" ${rc(i)} aria-pressed="${!!b}" onclick="${fn}(${i})">${R[i].e}<br>${R[i].n}<br>${1<<i}</button>`).join('')}</div>`;
function draw(){
  const body={ritual,forja,batalha,segredo}[tab]();
  app.innerHTML=`<h1>🔮 O Grimório das Seis Runas</h1><nav class="tabs" aria-label="Modos de jogo">${tabs.map(([k,t])=>`<button class="${k===tab?'on':'sec'}" aria-pressed="${k===tab}" onclick="tab='${k}';draw()">${t}</button>`).join('')}</nav>${body}`;
  if(tab==='segredo')upd();
}
function ritual(){
  if(!started)return `<div class="card ritual-intro"><div class="fig">${wizard()}</div><p>Eu sou o Mestre Arcano e leio mentes. Imagine o <b>nível de poder</b> do seu herói, um número de <b>1 a 63</b>, e não conte a ninguém.</p><p class="mut">Vou mostrar seis pergaminhos, um para cada runa. Diga se o seu número está neles.</p><button onclick="started=true;draw()">Já pensei!</button></div>`;
  if(step<6)return `<div class="fig fig-pequena">${wizard()}</div><p class="mut">Pergaminho ${step+1} de 6</p>${cardHTML(step)}<h2>A Runa de ${R[step].n} brilha no seu número?</h2><button onclick="resp[${step}]=1;step++;draw()">Sim (1)</button><button class="sec" onclick="resp[${step}]=0;step++;draw()">Não (0)</button>${step?'<button class="sec" onclick="step--;resp.length=step;draw()">Voltar</button>':''}`;
  const v=val(resp);
  return `<div class="card">${v?`<div class="fig">${heroT(tier(v))}</div><p style="text-align:center">Vejo tudo... O poder do seu herói é</p><div class="big">${v}</div><p class="tt">${titulo(v)}</p><p style="text-align:center"><b>${conta(resp)}</b></p><p class="mut">Cada runa acesa soma o seu valor. O truque: os valores 1, 2, 4, 8, 16 e 32 dobram a cada runa.</p>`:'<p>Nenhuma runa brilhou. Isso daria poder 0, mas o herói vai de 1 a 63. Tente de novo!</p>'}</div><button onclick="step=0;resp=[];started=false;draw()">Ler outra mente</button>`;
}
function forja(){
  const v=val(pl);
  return `<div class="card"><div class="fig">${heroT(tier(v),!v)}</div><p>Na Forja você acende as runas e cria um herói. Cada runa ativa (1) soma o seu valor; apagada (0), não soma nada.</p>${runeBtns(pl,'fg')}<div class="big">${v}</div><p class="tt">${v?titulo(v):'Sem poder algum'}</p><p style="text-align:center" class="mut">${conta(pl)}</p><p style="text-align:center" class="mut">Respostas: ${pl.map((b,i)=>`R${i+1}=${b}`).join(' ')}</p></div><button class="sec" onclick="pl=[0,0,0,0,0,0];draw()">Apagar todas</button>`;
}
function fg(i){pl[i]^=1;draw()}
const RANGE=[[1,15],[8,30],[16,45],[30,63],[40,63]];
function hpNew(){const [a,b]=RANGE[B.n];return a+(Math.random()*(b-a+1)|0)}
function batalha(){
  if(!B){B={n:0,xp:0,hp:3,miss:0,sel:[0,0,0,0,0,0],msg:'',cls:''};B.d=hpNew()}
  if(B.won)return `<div class="card"><div class="fig">${heroT(Math.min(B.n,4))}${dragon(B.n-1,1)}</div><h2>Dragão derrotado! +${B.gain} XP</h2></div><button onclick="nextD()">${B.n===5?'Ver resultado':'Próximo dragão'}</button>`;
  if(B.hp<=0)return `<div class="card"><div class="fig">${heroT(Math.min(B.n,4),true)}${dragon(B.n)}</div><h2>O dragão venceu desta vez</h2><p>Você chegou ao dragão ${B.n+1} com ${B.xp} XP. Cuidado: se passar do dano, o dragão contra-ataca.</p></div><button onclick="B=null;draw()">Tentar de novo</button>`;
  if(B.n===5)return `<div class="card"><div class="fig">${heroT(4)}</div><h2>Os cinco dragões caíram!</h2><p>XP total: <b>${B.xp}</b>. ${B.xp>=45?'Você é um Arquimago do Grimório!':B.xp>=30?'Você é um Mago de Elite!':'Você é um Aventureiro corajoso!'}</p></div><button onclick="B=null;draw()">Nova aventura</button>`;
  const dano=val(B.sel);
  return `<p class="mut">Dragão ${B.n+1} de 5 · XP ${B.xp} · ${'❤️'.repeat(B.hp)}${'🖤'.repeat(3-B.hp)}</p><div class="card"><div class="fig">${heroT(Math.min(B.n,4))}${dragon(B.n)}</div><p class="tt">🐉 Vida: ${B.d}</p><p style="text-align:center">Acenda as runas para causar <b>exatamente ${B.d}</b> de dano.</p>${runeBtns(B.sel,'bt')}<p class="tt">Dano do feitiço: ${dano}</p><p class="${B.cls}" role="status">${B.msg}</p></div><button onclick="cast()">Lançar feitiço</button>`;
}
function bt(i){B.sel[i]^=1;B.msg='';draw()}
function cast(){
  const dano=val(B.sel);
  if(!dano){B.msg='Acenda pelo menos uma runa.';B.cls='wrong';draw();animar('heroi','erro');return}
  if(dano===B.d){
    B.gain=Math.max(10-2*B.miss,4);B.xp+=B.gain;B.n++;B.miss=0;B.sel=[0,0,0,0,0,0];B.msg='';B.won=true;
  }else if(dano<B.d){B.miss++;B.msg=`Faltaram ${B.d-dano} de dano. Falta uma runa?`;B.cls='wrong'}
  else{B.miss++;B.hp--;B.msg=`Passou ${dano-B.d} do dano! O dragão contra-ataca 💥`;B.cls='wrong'}
  draw();animar('heroi',B.won?'acerto':B.hp<=0?'derrota':dano>B.d?'erro':'erro');
}
function segredo(){
  return `<div class="card"><div class="fig">${wizard()}</div><p>O segredo do Mestre Arcano: os valores das runas <b>dobram</b> a cada uma (1, 2, 4, 8, 16, 32) e todo número de 1 a 63 tem uma única receita feita com elas. Em Matemática, isso é escrever o número em <b>base 2</b>.</p><p>Cada resposta Sim ou Não corta os números possíveis pela metade. Depois de 6 respostas, sobra só um.</p></div>
  <div class="card"><label for="pn"><b>Escolha um poder de 1 a 63:</b></label> <input id="pn" inputmode="numeric" value="13" oninput="upd()"><div id="ex"></div></div>
  <button class="sec" onclick="window.print()">Imprimir os 6 pergaminhos</button>`;
}
function upd(){
  const n=+document.getElementById('pn').value,o=document.getElementById('ex');
  if(!/^(?:[1-9]|[1-5]\d|6[0-3])$/.test(document.getElementById('pn').value.trim())){o.innerHTML='<p class="wrong">Digite um número de 1 a 63.</p>';return}
  const a=[0,1,2,3,4,5].map(i=>n>>i&1);
  o.innerHTML=`<p>Receita: <b>${conta(a)}</b></p><p>Em base 2: <b>${[...a].reverse().join('')}</b></p><p class="mut">Aparece nos pergaminhos: ${a.map((b,i)=>b?R[i].e+' '+R[i].n:'').filter(Boolean).join(', ')}</p>`;
}
draw();
</script>
<script type="module" src="./js/animacao/ativar-chibis.js?v=21"></script>
</body>
</html>
